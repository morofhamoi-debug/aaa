<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101014">
    <meta name="description" content="VEXA — маркетплейс цифровых коллекционных подарков с 3D-моделями, коллекциями и торговлей.">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237e6df2'/%3E%3Cpath d='M13 16h10l9 23 9-23h10L36 50H28z' fill='white'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/vexa/styles.css">
    <title>VEXA — Digital Collectibles</title>
  </head>
  <body>
    <div id="app">
      <main class="auth-entry">
        <div class="auth-entry-brand"><span class="wordmark-mark">V</span><strong>VEXA</strong></div>
        <section class="auth-entry-card">
          <span class="eyebrow">DIGITAL COLLECTIBLES MARKETPLACE</span>
          <h1>Войти в VEXA</h1>
          <p class="auth-entry-description">Выбери удобный способ входа в аккаунт.</p>
          <button class="auth-entry-button auth-entry-telegram" data-action="telegram-login" type="button">
            <span class="auth-entry-button-icon">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.5 4.5-3.1 15c-.2 1.1-.8 1.4-1.7.9l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.4-4.9 9-8.1c.4-.4-.1-.6-.6-.3L6.3 13.2l-4.7-1.5c-1-.3-1-1 .2-1.5l18.3-7.1c.9-.3 1.7.2 1.4 1.4Z"/></svg>
            </span>
            <span>Войти через Telegram</span>
            <span class="auth-entry-button-arrow"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></span>
          </button>
          <button class="auth-entry-button auth-entry-email" data-action="login" type="button">
            <span class="auth-entry-button-icon">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            </span>
            <span>Войти через почту</span>
            <span class="auth-entry-button-arrow"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></span>
          </button>
          <div class="auth-entry-divider"><span>или</span></div>
          <p class="auth-entry-register">Впервые в VEXA? <button data-action="register" type="button">Создать аккаунт</button></p>
        </section>
        <p class="auth-entry-foot">Один аккаунт для коллекций, избранного и личного инвентаря.</p>
      </main>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="./src/vexa/main.js"></script>
  </body>
</html>
