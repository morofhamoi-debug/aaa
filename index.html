<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f8">
  <meta name="description" content="Маркетплейс цифровых коллекционных подарков">
  <title>Gift Market</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="back-button" class="icon-button back-button" type="button" aria-label="Назад" hidden><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="topbar-title-wrap">
        <div class="brand-mark"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 13.7 9l5.8 3-5.8 2.8L12 20.5l-1.7-5.7L4.5 12l5.8-3L12 3.5Z"/></svg></div>
        <div>
          <div id="page-title" class="page-title">Рынок</div>
          <div id="page-subtitle" class="page-subtitle">Коллекционные подарки</div>
        </div>
      </div>
      <div id="balance-pill" class="balance-pill" hidden>
        <span class="balance-caption">Баланс</span>
        <div class="balance-row">
          <button id="currency-toggle" class="currency-toggle" type="button" aria-label="Сменить валюту отображения">
            <span id="currency-symbol">₽</span>
          </button>
          <strong id="balance-value">0</strong>
        </div>
      </div>
    </header>

    <main id="screen" class="screen" aria-live="polite">
      <div class="loading-state"><div class="loader"></div><span>Загрузка…</span></div>
    </main>

    <nav id="bottom-nav" class="bottom-nav" hidden aria-label="Основная навигация">
      <button class="nav-button active" type="button" data-tab="market">
        <span class="nav-icon"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></span><span>Рынок</span>
      </button>
      <button class="nav-button" type="button" data-tab="my_nft">
        <span class="nav-icon"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 3-4 6 10 12L22 9l-4-6H6Z"/><path d="M2 9h20"/><path d="m6 3 6 18 6-18"/></svg></span><span>Мои NFT</span>
      </button>
      <button class="nav-button" type="button" data-tab="settings">
        <span class="nav-icon"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.8 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.8-1l-1.7.7-1.4-2.4 1.4-1.1a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.8-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.8 1l1.7-.7 1.4 2.4-1.4 1.1a8 8 0 0 1 0 2Z"/></svg></span><span>Настройки</span>
      </button>
    </nav>
    <div id="toast" class="toast" role="status"></div>
  </div>
</body>
</html>
