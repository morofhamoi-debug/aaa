name: Bootstrap TACTICAL STRIKE
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  expand-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source archive into project files
        shell: bash
        run: |
          if [ -d .bootstrap ]; then
            cat .bootstrap/part-* > .bootstrap.tar.gz
            tar -tzf .bootstrap.tar.gz >/dev/null
            tar -xzf .bootstrap.tar.gz -C .
            rm -rf .bootstrap .bootstrap.tar.gz
            # Avoid changing workflow files: the GitHub App token lacks workflows scope.
            rm -f .github/workflows/pages.yml BOOTSTRAP_TRIGGER*.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Expand TACTICAL STRIKE project sources"
            # Rebase on any commit that arrived after this workflow checked out main.
            git pull --rebase origin main
            # Remove a temporary trigger that may have arrived during the run.
            rm -f BOOTSTRAP_TRIGGER*.md
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Remove temporary bootstrap trigger files"
            fi
            git push
          else
            echo "Source archive already expanded."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run source checks and unit tests
        run: npm run check
      - name: Build production bundle
        run: npm run build
